<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>My Website</title>
  <style>
    body {
      margin: 0;
      font-family: system-ui, sans-serif;
      line-height: 1.6;
      color: #222;
      background: #fafafa;
    }
    header {
      background: #111;
      color: #fff;
      padding: 2rem;
      text-align: center;
    }
    nav {
      display: flex;
      justify-content: center;
      gap: 1rem;
      padding: 1rem;
      background: #eee;
    }
    nav a {
      color: #111;
      text-decoration: none;
      font-weight: 600;
    }
    .container {
      max-width: 800px;
      margin: 2rem auto;
      padding: 0 1rem;
    }
    footer {
      text-align: center;
      padding: 2rem;
      font-size: 0.9rem;
      color: #555;
    }
  </style>
</head>
<body>
  <header style="background: linear-gradient(135deg, #0d0d0d, #2a2a2a); color: #fff; padding: 6rem 2rem; text-align: center;">
    <h1 style="font-size: 3.5rem; margin: 0;">massimodimatteo.com</h1>
    <p style="font-size: 1.2rem; opacity: 0.75; margin-top: 1rem;">Welcome</p>
  </header>

  <section style="max-width: 900px; margin: 4rem auto; padding: 0 1rem; text-align: center;">

  <h2 style="margin-bottom: 2rem;">3D Model Preview</h2>

  <model-viewer
    src="model.usdz"
    alt="3D model"
    style="width: 100%; height: 400px;"
    ar
    ar-modes="quick-look"
    interaction-prompt="auto"
    camera-controls
    auto-rotate
    exposure="1.0">
  </model-viewer>

</section>

<script type="module" src="https://unpkg.com/@google/model-viewer/dist/model-viewer.min.js"></script>

  <footer style="text-align: center; padding: 2rem; font-size: 0.9rem; color: #555;">
    © 2025 massimodimatteo.com
  </footer>
</body>
</html>
